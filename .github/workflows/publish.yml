name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: chisel
            asset: chisel-x86_64-unknown-linux-musl
            musl: true
          - os: macos-14
            target: aarch64-apple-darwin
            bin: chisel
            asset: chisel-aarch64-apple-darwin
            musl: false
          - os: macos-14
            target: x86_64-apple-darwin
            bin: chisel
            asset: chisel-x86_64-apple-darwin
            musl: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: chisel.exe
            asset: chisel-x86_64-pc-windows-msvc.exe
            musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "stage/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: stage/${{ matrix.asset }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Rust binaries for ${{ github.ref_name }}.
            `chisel-mcp` is this same `chisel` program.
          files: |
            assets/chisel-x86_64-unknown-linux-musl
            assets/chisel-aarch64-apple-darwin
            assets/chisel-x86_64-apple-darwin
            assets/chisel-x86_64-pc-windows-msvc.exe
          fail_on_unmatched_files: true
