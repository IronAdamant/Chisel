name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: chisel
            asset: chisel-x86_64-unknown-linux-musl
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: chisel
            asset: chisel-aarch64-apple-darwin
            musl: false
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: chisel
            asset: chisel-x86_64-apple-darwin
            musl: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: chisel.exe
            asset: chisel-x86_64-pc-windows-msvc.exe
            musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "stage/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: stage/${{ matrix.asset }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          shopt -s nullglob
          found=(chisel-*)
          expected=(
            chisel-aarch64-apple-darwin
            chisel-x86_64-apple-darwin
            chisel-x86_64-pc-windows-msvc.exe
            chisel-x86_64-unknown-linux-musl
          )
          if [[ ${#found[@]} -ne 4 ]]; then
            echo "expected 4 release binaries, found ${#found[@]}" >&2
            printf '  %s\n' "${found[@]}" >&2
            exit 1
          fi
          for bin in "${expected[@]}"; do
            if [[ ! -f "$bin" ]]; then
              echo "missing ${bin}" >&2
              ls -la >&2
              exit 1
            fi
          done
          sha256sum -- "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Rust binaries for ${{ github.ref_name }}.
            `chisel-mcp` is this same `chisel` program.
            Check `SHA256SUMS` before use.
          files: |
            assets/chisel-x86_64-unknown-linux-musl
            assets/chisel-aarch64-apple-darwin
            assets/chisel-x86_64-apple-darwin
            assets/chisel-x86_64-pc-windows-msvc.exe
            assets/SHA256SUMS
          fail_on_unmatched_files: true
