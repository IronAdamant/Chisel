# Analyze a repo with the Chisel Rust binary. Do not pip-install Chisel.
name: Chisel

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chisel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Build
        run: cargo build --release
      - name: Analyze
        run: ./target/release/chisel analyze . --json
      - name: Stats
        run: ./target/release/chisel stats --json
